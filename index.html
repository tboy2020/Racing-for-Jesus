/* ============================================================================
   RACING FOR JESUS — "The Great Commission Road"
   ACT I — Daniel's City of Prayer (Scenes 1–10).  © 2026 Taiwo Adegoke.
   Single-file HTML5 canvas, 960x540 letterboxed, top-down. Child-safe (ages ~4-8):
   no death; the "enemy" is only darkness that recedes as the light grows.
   GUARDRAIL: real KJV shown DISTINCT (gold Cinzel + ✦ + ref, caption('word'));
   invented mission narration stays plain (caption('narr')).

var W=960, H=540;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var scale=1, offX=0, offY=0;
function resize(){ var vw=window.innerWidth, vh=window.innerHeight; scale=Math.min(vw/W,vh/H); var dw=W*scale,dh=H*scale; offX=(vw-dw)/2; offY=(vh-dh)/2; cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR); cv.style.width=vw+'px'; cv.style.height=vh+'px'; document.getElementById('rotate').classList.toggle('on', vh>vw*1.15 && vw<620); }
window.addEventListener('resize',resize); resize();
function applyCam(){ ctx.setTransform(scale*DPR,0,0,scale*DPR, offX*DPR, offY*DPR); }

/* ---------- helpers ---------- */
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function vgrad(x0,y0,x1,y1,st){ var g=ctx.createLinearGradient(x0,y0,x1,y1); for(var i=0;i<st.length;i++) g.addColorStop(st[i][0],st[i][1]); return g; }
function rgrad(x,y,r0,r1,st){ var g=ctx.createRadialGradient(x,y,r0,x,y,r1); for(var i=0;i<st.length;i++) g.addColorStop(st[i][0],st[i][1]); return g; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function mixHex(a,b,k){ k=clamp(k,0,1); return 'rgb('+[0,1,2].map(function(i){ return Math.round(lerp(parseInt(a.substr(1+i*2,2),16),parseInt(b.substr(1+i*2,2),16),k)); }).join(',')+')'; }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }

/* ---------- audio ---------- */
var AC=null;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,ty,v,sl){ var a=actx(); if(!a) return; var o=a.createOscillator(), g=a.createGain(); o.type=ty||'sine'; o.frequency.value=f; if(sl) o.frequency.exponentialRampToValueAtTime(sl,a.currentTime+d); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noiseBurst(d,v,lp){ var a=actx(); if(!a) return; var n=a.createBufferSource(), buf=a.createBuffer(1,a.sampleRate*d,a.sampleRate), da=buf.getChannelData(0); for(var i=0;i<da.length;i++) da[i]=(Math.random()*2-1)*(1-i/da.length); n.buffer=buf; var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1200; var g=a.createGain(); g.gain.value=v||0.2; g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); n.connect(f); f.connect(g); g.connect(a.destination); n.start(); }
var sfx={
  deliver:function(){ tone(760,0.09,'square',0.08,1180); setTimeout(function(){tone(1180,0.1,'square',0.06);},70); },
  bless:function(){ [660,880,1320].forEach(function(f,i){ setTimeout(function(){tone(f,0.5,'sine',0.1);},i*90); }); },
  load:function(){ noiseBurst(0.08,0.07,500); tone(300,0.1,'sine',0.07,440); },
  pray:function(){ tone(523,0.6,'sine',0.1); setTimeout(function(){tone(784,0.7,'sine',0.09);},150); setTimeout(function(){tone(1047,0.8,'sine',0.07);},300); },
  shield:function(){ tone(900,0.14,'triangle',0.1,1500); noiseBurst(0.2,0.08,2000); },
  truck:function(){ tone(160,0.3,'sawtooth',0.08,120); noiseBurst(0.3,0.06,400); },
  gate:function(){ tone(400,0.3,'sine',0.1,800); setTimeout(function(){tone(900,0.4,'sine',0.08);},150); },
  win:function(){ [523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){tone(f,0.5,'sine',0.11);},i*130); }); }
};

/* ---------- caption (the guardrail) ---------- */
var capEl=document.getElementById('cap'), capInner=document.getElementById('capInner');
function caption(kind,text,ref){ if(!text){ capEl.classList.remove('on'); return; } if(kind==='word') capInner.innerHTML='<span class="word">'+text+'</span>'+(ref?'<span class="ref">'+ref+'</span>':''); else capInner.innerHTML='<span class="narr">'+text+'</span>'; capEl.classList.add('on'); }

/* ============================================================================
   REAL KJV (public domain, exact) — the Word given, by feeling.
   (For the full game these resolve from Selah's src/kjv.json.)
   ============================================================================ */
var VERSES={
  afraid:  {text:'Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.', ref:'Isaiah 41:10'},

  confused:{text:'Trust in the LORD with all thine heart; and lean not unto thine own understanding.', ref:'Proverbs 3:5'},
  inneed:  {text:'But my God shall supply all your need according to his riches in glory by Christ Jesus.', ref:'Philippians 4:19'},
  small:   {text:'I will praise thee; for I am fearfully and wonderfully made.', ref:'Psalm 139:14'},
  betrayed:{text:'But as for you, ye thought evil against me; but God meant it unto good… to save much people alive.', ref:'Genesis 50:20'},
  forgotten:{text:'Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.', ref:'Isaiah 49:16'}
};

/* ---------- input ---------- */
var keys={};
addEventListener('keydown',function(e){ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault(); actx();
  if(humanCount()===0 && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space','KeyF','KeyE','Enter'].indexOf(e.code)>=0) ensureLocalPlayer(); });
addEventListener('keyup',function(e){ keys[e.code]=false; });
var touchV={x:0,y:0,act:false};
function readPads(){ return (navigator.getGamepads&&navigator.getGamepads())||[]; }
var padSeen=false;
/* ============================================================================
   COUCH CO-OP — 2–8 players share ONE vehicle & ONE camera (never split-screen).
   STRICT Driver owns the wheel; other players assist (aligned only) + man a seat.
   Any player can help with the context action; an AI net fills every empty/idle
   seat so a solo 4-year-old is NEVER stuck. Connecting a pad turns on TV Mode.
   (Plumbing adapted from the Pastor's david-coop.html; cap raised 4→8.)
   ============================================================================ */
var MAXP=8, TV=false, prevPad={}, actingPlayer=null;
var COLORS=[
  {name:'Blue',hue:'#5a8fd0'},{name:'Green',hue:'#4fd08a'},{name:'Gold',hue:'#f2c14e'},{name:'Rose',hue:'#ec74a8'},
  {name:'Sky',hue:'#53d6e0'},{name:'Coral',hue:'#ff8a5c'},{name:'Violet',hue:'#b38cf0'},{name:'Lime',hue:'#bfe36a'}
];
var SEATS=['Driver','Hugger','Watchman','Loader','Navigator','Lookout','Light-Bearer','Helper'];
var players=[];
function activePlayers(){ return players.filter(function(p){ return !p.inactive; }); }
function humanCount(){ return activePlayers().length; }
function seatOf(seat){ for(var i=0;i<players.length;i++){ var p=players[i]; if(!p.inactive && p.seat===seat) return p; } return null; }
function nextSeat(){ for(var s=0;s<SEATS.length;s++){ if(!seatOf(SEATS[s])) return SEATS[s]; } return SEATS[SEATS.length-1]; }
function addPlayer(opts){ opts=opts||{}; if(humanCount()>=MAXP) return null;
  var p={ idx:players.length, col:COLORS[players.length%COLORS.length], seat:nextSeat(),
    pad:(opts.pad!=null?opts.pad:null), kb:!!opts.kb, touch:!!opts.touch, padId:opts.padId||'', inactive:false,
    reached:0, pleas:0, prays:0, loads:0, _actPrev:true };
  players.push(p); return p;
}
function ensureLocalPlayer(){ for(var i=0;i<players.length;i++){ if(!players[i].inactive && (players[i].kb||players[i].touch)) return players[i]; } return addPlayer({kb:true,touch:true}); }
function padPressed(gp,i){ return !!(gp&&gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5)); }
function padEdge(key,gp,i){ var k=key+':'+i, now=padPressed(gp,i), was=prevPad[k]; prevPad[k]=now; return now&&!was; }
function claimedPad(i){ for(var k=0;k<players.length;k++){ if(!players[k].inactive && players[k].pad===i) return true; } return false; }
function pollJoins(){ var gs=readPads();
  for(var i=0;i<gs.length && i<MAXP;i++){ var gp=gs[i]; if(!gp) continue; padSeen=true; TV=true;
    if(claimedPad(i)) continue;
    var join=padPressed(gp,0)||padPressed(gp,1)||padPressed(gp,2)||padPressed(gp,3)
           ||Math.abs(gp.axes[0]||0)>0.5||Math.abs(gp.axes[1]||0)>0.5||padPressed(gp,12)||padPressed(gp,13)||padPressed(gp,14)||padPressed(gp,15);
    if(!join) continue;
    var ex=null; for(var r=0;r<players.length;r++){ if(players[r].inactive && players[r].padId && players[r].padId===gp.id){ ex=players[r]; break; } }
    if(ex){ if(humanCount()>=MAXP) continue; ex.inactive=false; ex.pad=i; ex._actPrev=true;
      for(var q=0;q<players.length;q++){ if(players[q]!==ex && !players[q].inactive && players[q].seat===ex.seat){ ex.seat=nextSeat(); break; } }   // seat was taken while away → re-home
    } else { var np=addPlayer({pad:i,padId:gp.id}); if(np) np._actPrev=true; }
    prevPad['m'+i+':0']=true; prevPad['m'+i+':9']=true; actx();   // don't re-read the join press as a menu press
  }
}
addEventListener('gamepadconnected',function(){ TV=true; padSeen=true; });
addEventListener('gamepaddisconnected',function(e){ for(var i=0;i<players.length;i++){ if(players[i].pad===e.gamepad.index){ players[i].inactive=true; players[i].pad=null; } } });
function readPlayer(p){ var dx=0,dy=0,act=false,rt=false,lt=false;
  if(p.kb){ if(keys['ArrowLeft']||keys['KeyA'])dx-=1; if(keys['ArrowRight']||keys['KeyD'])dx+=1; if(keys['ArrowUp']||keys['KeyW'])dy-=1; if(keys['ArrowDown']||keys['KeyS'])dy+=1; if(keys['Space']||keys['KeyF']||keys['KeyE']||keys['Enter'])act=true; }
  if(p.touch){ dx+=touchV.x; dy+=touchV.y; if(touchV.act)act=true; }
  if(p.pad!=null){ var gp=readPads()[p.pad]; if(gp){ var ax=gp.axes[0]||0, ay=gp.axes[1]||0; if(Math.abs(ax)>0.3)dx+=ax; if(Math.abs(ay)>0.3)dy+=ay;
    if(padPressed(gp,14))dx-=1; if(padPressed(gp,15))dx+=1; if(padPressed(gp,12))dy-=1; if(padPressed(gp,13))dy+=1;
    if(padPressed(gp,0)||padPressed(gp,1)||padPressed(gp,2))act=true; if(padPressed(gp,7))rt=true; if(padPressed(gp,6))lt=true; } }
  var m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  var edge=act&&!p._actPrev; p._actPrev=act;
  return {dx:dx,dy:dy,act:act,actEdge:edge,rt:rt,lt:lt};
}
function readTeam(){
  var reads=[], anyAct=false, anyEdge=false, rt=false, lt=false, presser=null;
  for(var j=0;j<players.length;j++){ var p=players[j]; if(p.inactive) continue; var r=readPlayer(p); p._read=r; reads.push({p:p,r:r});
    if(r.act)anyAct=true; if(r.actEdge){ anyEdge=true; if(!presser)presser=p; } if(r.rt)rt=true; if(r.lt)lt=true; }
  if(reads.length===0) return {dx:0,dy:0,act:false,actEdge:false,rt:false,lt:false,presser:null};
  var drv=seatOf('Driver'), lead=drv?drv._read:reads[0].r, leadP=drv||reads[0].p;
  var dx=lead.dx, dy=lead.dy;
  for(var k=0;k<reads.length;k++){ if(reads[k].p===leadP) continue; var r2=reads[k].r, mag=Math.hypot(r2.dx,r2.dy); if(mag<0.1) continue;
    var dot=dx*r2.dx+dy*r2.dy; if(dot>=0 || (Math.abs(dx)+Math.abs(dy))<0.05){ dx+=r2.dx*0.35; dy+=r2.dy*0.35; } }    // aligned assist only — can't fight the wheel
  var m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  return {dx:dx,dy:dy,act:anyAct,actEdge:anyEdge,rt:rt,lt:lt,presser:presser};
}
var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
function setupTouch(){
  var box=document.getElementById('touch'); box.innerHTML='';
  function mk(html,css){ var b=document.createElement('div'); b.className='tbtn'; b.style.cssText='width:64px;height:64px;font-size:22px;position:absolute;'+css; b.innerHTML=html; box.appendChild(b); return b; }
  function bind(el,setter){ el.addEventListener('touchstart',function(e){e.preventDefault();setter(true);actx();if(humanCount()===0)ensureLocalPlayer();},{passive:false}); el.addEventListener('touchend',function(e){e.preventDefault();setter(false);},{passive:false}); el.addEventListener('mousedown',function(e){e.preventDefault();setter(true);actx();if(humanCount()===0)ensureLocalPlayer();}); addEventListener('mouseup',function(){setter(false);}); }
  var L='left:calc(16px + env(safe-area-inset-left));', R='right:calc(16px + env(safe-area-inset-right));', b='env(safe-area-inset-bottom)';
  bind(mk('▲','left:calc(88px + env(safe-area-inset-left));bottom:calc(92px + '+b+');'),function(v){touchV.y=v?-1:0;});
  bind(mk('▼','left:calc(88px + env(safe-area-inset-left));bottom:calc(22px + '+b+');'),function(v){touchV.y=v?1:0;});
  bind(mk('◀',L+'bottom:calc(57px + '+b+');'),function(v){touchV.x=v?-1:0;});
  bind(mk('▶','left:calc(160px + env(safe-area-inset-left));bottom:calc(57px + '+b+');'),function(v){touchV.x=v?1:0;});
  bind(mk('✦',R+'bottom:calc(24px + '+b+');width:82px;height:82px;font-size:28px;background:rgba(242,193,78,.25);border-color:rgba(255,220,140,.5);'),function(v){touchV.act=v;});
  if(isTouch) box.style.display='block';                 // reveal the on-screen controls on touch devices
}
setupTouch();

/* ---------- acts (the continuous journey) ---------- */
var ACTS=[
  {roman:'I',  name:'Daniel’s City of Prayer',        start:0,  end:9 },
  {roman:'II', name:'Abraham’s Road & Joseph’s Egypt', start:10, end:19}
];
function actOf(i){ for(var a=0;a<ACTS.length;a++){ if(i>=ACTS[a].start && i<=ACTS[a].end) return ACTS[a]; } return ACTS[ACTS.length-1]; }

/* ============================================================================
   STATE
   ============================================================================ */
var t=0, shake=0, parts=[];
function addPart(o){ o.life=o.life||1; o.age=0; parts.push(o); }
function updateParts(dt){ for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.age+=dt; p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt; if(p.grav) p.vy=(p.vy||0)+p.grav*dt; if(p.age>=p.life) parts.splice(i,1); } }
var car={ x:480,y:470,vx:0,vy:0,ang:-Math.PI/2 };
var PROG={ souls:0 };            // lifetime souls across the act
var sceneIdx=0, G={};

function buildScene(i){
  var s=SCENES[i]; sceneIdx=i;
  var people=s.people.map(function(p){ return {feel:p[0], x:p[1], y:p[2], reached:false, bloom:0, bob:rand(0,TAU)}; });
  G={
    cfg:s, title:s.title, sub:s.sub,
    people:people, total:people.length,
    depot:{x:s.depot[0],y:s.depot[1]},
    truck: s.truck?{x:s.truck[0],y:s.truck[1]}:null,
    stations:(s.stations||[]).map(function(st){ return {x:st[0],y:st[1],mandatory:!!st[2],kind:st[3]||'pray',prayed:false}; }),
    traps:(s.traps||[]).map(function(tr){ return {x:tr[0],y:tr[1],r:tr[2],armed:true,shieldT:0,warnT:0}; }),
    gate: s.gate?{x:s.gate[0],open:false}:null,
    signpost: s.signpost?{x:s.signpost[0],y:s.signpost[1]}:null,
    dim:!!s.dim, finale:!!s.finale, mandatoryHint:s.mandatoryHint,
    cap:s.cap||3, vehicle:'car', cargo:0, souls:0,
    light:0, sun:0, evening:false,
    praying:false, prayT:0, prayMin:0, idle:0, done:false, started:false, pleadTaught:false, intro:s.intro
  };
  var sx=G.depot.x, sy=G.depot.y-6;
  car.x=sx; car.y=sy; car.vx=0; car.vy=0; car.ang=-Math.PI/2;
}

function nearNode(){
  if(G.truck && dist(car.x,car.y,G.truck.x,G.truck.y)<46 && G.vehicle!=='truck') return {type:'truck'};
  if(dist(car.x,car.y,G.depot.x,G.depot.y)<46) return {type:'depot'};
  for(var i=0;i<G.stations.length;i++){ if(dist(car.x,car.y,G.stations[i].x,G.stations[i].y)<44) return {type:'station',s:G.stations[i]}; }
  var best=null,bd=48;
  for(var j=0;j<G.people.length;j++){ var p=G.people[j]; if(p.reached) continue; var d=dist(car.x,car.y,p.x,p.y); if(d<bd){ bd=d; best={type:'person',p:p}; } }
  return best;
}

/* ============================================================================
   UPDATE
   ============================================================================ */
function doDeliver(p){
  p.reached=true; p.bloom=0.001; G.cargo--; G.souls++; PROG.souls++;
  var hg=seatOf('Hugger')||actingPlayer; if(hg) hg.reached++;      // co-op credit for the roster
  G.light=clamp(G.light + 1/G.total, 0, 1);
  var v=VERSES[p.feel]||VERSES.sad; caption('word', v.text, v.ref);
  sfx.deliver(); sfx.bless();
  for(var q=0;q<18;q++) addPart({x:p.x,y:p.y-10,vx:rand(-70,70),vy:rand(-150,-30),grav:260,life:1.2,col:(q%2?'rgba(255,220,140,0.9)':'rgba(255,255,255,0.9)'),r:rand(2,4)});
  if(G.souls>=G.total) setTimeout(winScene,1400);
}
function startPray(st){ G.praying=true; G.prayT=0; G.prayMin=0; G.prayStation=st;
  if(st && st.kind==='seek'){ G.prayLabel='Be still, and seek…';
    caption('word','Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.','Psalm 46:10'); }
  else { G.prayLabel='Breathe, and pray like Daniel…';
    caption('word','He kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.','Daniel 6:10'); } }
/* ---- the never-stuck AI net: fills empty/idle seats so a solo child always finishes ---- */
function markActive(I){ if(Math.abs(I.dx)+Math.abs(I.dy)>0.08 || I.act || I.rt || I.lt) G.idle=0; }
function aiTarget(){                                             // the UNBLOCK priority list
  if(G.gate && !G.gate.open){ for(var i=0;i<G.stations.length;i++){ var s=G.stations[i]; if(s.mandatory && !s.prayed) return {x:s.x,y:s.y}; } }
  var remain=0; for(var j=0;j<G.people.length;j++){ if(!G.people[j].reached) remain++; }
  if(remain>0 && G.cargo<=0) return {x:G.depot.x,y:G.depot.y};
  if(remain>0 && G.cargo>0){ var best=null,bd=1e9; for(var k=0;k<G.people.length;k++){ var p=G.people[k]; if(p.reached) continue; var d=dist(car.x,car.y,p.x,p.y); if(d<bd){bd=d;best=p;} } if(best) return {x:best.x,y:best.y}; }
  return null;
}
function doNode(node){                                          // the context action — human OR AI calls the SAME verbs
  if(node.type==='depot'){ if(G.cargo<G.cap){ G.cargo=G.cap; sfx.load(); var a=seatOf('Loader')||actingPlayer; if(a)a.loads++;
    for(var q=0;q<10;q++) addPart({x:G.depot.x,y:G.depot.y-14,vy:rand(-90,-20),vx:rand(-40,40),grav:200,life:0.7,col:'rgba(180,220,255,0.9)',r:rand(2,3)}); } }
  else if(node.type==='truck'){ G.vehicle='truck'; G.cap=8; G.cargo=Math.min(G.cargo,8); sfx.truck(); caption('narr','The Gospel Truck! Now you can carry far more of the Word. Load up at the depot.'); setTimeout(function(){ if(!G.done) caption(); },2800); }
  else if(node.type==='station'){ startPray(node.s); }
  else if(node.type==='person'){ if(G.cargo>0) doDeliver(node.p); else { caption('narr','Out of Bibles — drive back to the depot to load more.'); setTimeout(function(){ if(!G.done) caption(); },2200); } }
}
function aiSeats(){                                             // only acts when the humans are idle; any human press pre-empts
  if(!G.started || G.praying) return;
  var node=nearNode(); if(!node) return;
  if(node.type==='depot' && G.cargo<=0 && G.idle>1.5){ actingPlayer=null; doNode(node); }
  else if(node.type==='person' && G.cargo>0 && G.idle>1.8){ actingPlayer=null; doNode(node); }
  else if(node.type==='station' && node.s.mandatory && !node.s.prayed && G.gate && !G.gate.open && G.idle>2.0){ actingPlayer=null; startPray(node.s); }
}
function update(dt){
  pollJoins();                                                  // late controllers can join mid-scene
  var I=readTeam();
  G.idle=(G.idle||0)+dt;
  if(G.praying){
    if(I.act){ G.idle=0; G.prayT=clamp(G.prayT+dt/3.2,0,1); }    // a human holding fills at full rate
    else if(G.idle>1.2){ G.prayT=clamp(G.prayT+dt/4.2,0,1); }    // else the AI completes it for an idle/solo child
    G.prayMin=(G.prayMin||0)+dt;
    if(G.prayT>=1 && G.prayMin>1.0){ G.praying=false; if(G.prayStation){ G.prayStation.prayed=true; var wm=seatOf('Watchman')||actingPlayer; if(wm)wm.prays++; }
      G.sun=clamp(G.sun-0.4,0,1); G.light=clamp(G.light+0.05,0,1);
      for(var i=0;i<G.traps.length;i++) G.traps[i].armed=false;                // prayer clears the gloom
      if(G.gate){ G.gate.open=true; sfx.gate(); for(var q=0;q<20;q++) addPart({x:G.gate.x,y:rand(60,H-40),vx:rand(40,120),vy:rand(-40,40),life:1,col:'rgba(255,230,160,0.9)',r:rand(2,3)}); }
      if(G.finale){ G.light=clamp(G.light+0.2,0,1); }
      caption('narr', G.gate?'The way is opened — go on in the strength of prayer.':'Strengthened by prayer — now go on, and carry the Word.'); sfx.pray();
      setTimeout(function(){ if(!G.done) caption(); },3000); }
    return;
  }
  markActive(I);
  // AI auto-pilot — drives when the Driver seat is empty, or a solo/idle child has left the wheel for a while (never during the opening verse)
  if(G.started && (!seatOf('Driver') || G.idle>3.0)){ var tg=aiTarget(); if(tg){ var pa=Math.atan2(tg.y-car.y,tg.x-car.x), ease=dist(car.x,car.y,tg.x,tg.y)<60?0.4:1; I.dx=Math.cos(pa)*ease; I.dy=Math.sin(pa)*ease; } }
  // drive
  var acc=640;
  car.vx += I.dx*acc*dt; car.vy += I.dy*acc*dt;
  if(I.rt){ car.vx += Math.cos(car.ang)*acc*0.7*dt; car.vy += Math.sin(car.ang)*acc*0.7*dt; }   // RT keep-moving (any pad)
  if(I.lt){ car.vx *= Math.max(0,1-5*dt); car.vy *= Math.max(0,1-5*dt); }                         // LT brake
  car.vx *= Math.max(0,1-3.2*dt); car.vy *= Math.max(0,1-3.2*dt);
  var sp=Math.hypot(car.vx,car.vy), MAX=(G.vehicle==='truck'?205:240); if(sp>MAX){ car.vx*=MAX/sp; car.vy*=MAX/sp; }
  car.x=clamp(car.x+car.vx*dt,24,W-24); car.y=clamp(car.y+car.vy*dt,54,H-20);
  if(G.gate && !G.gate.open && car.x>G.gate.x-20){ car.x=G.gate.x-20; car.vx=Math.min(0,car.vx); }   // mandatory prayer gate
  if(sp>12) car.ang=Math.atan2(car.vy,car.vx);
  if(!G.done){ G.sun=clamp(G.sun+dt/160,0,1); if(G.sun>=1 && !G.evening){ G.evening=true; caption('narr','Evening came — keep going, there is grace for the journey.'); setTimeout(function(){ if(!G.done) caption(); },3000); } }
  // traps
  var flee=(G.cfg.evadeMode==='flee');
  for(var i=0;i<G.traps.length;i++){ var tr=G.traps[i]; if(tr.shieldT>0) tr.shieldT-=dt; if(!tr.armed) continue;
    var d=dist(car.x,car.y,tr.x,tr.y), inZone=d<tr.r+10;
    if(flee){
      if(inZone){ tr.warnT+=dt; car.vx*=0.9; car.vy*=0.9;
        if(!G.pleadTaught){ G.pleadTaught=true; caption('word','There hath no temptation taken you but such as is common to man… but will with the temptation also make a way to escape.','1 Corinthians 10:13'); setTimeout(function(){ if(!G.done) caption(); },3600); }
        else caption('narr','Flee — turn away, and take the way of escape.');
        if(tr.warnT>2.6){ tr.armed=false; tr.shieldT=1; sfx.shield(); caption('narr','A way of escape — keep going.'); setTimeout(function(){ if(!G.done) caption(); },1600); }
      } else {
        if(tr.warnT>0.3){ tr.armed=false; tr.shieldT=1; G.light=clamp(G.light+0.02,0,1); sfx.shield(); shake=4;
          for(var q=0;q<12;q++){ var a2=q/12*TAU; addPart({x:tr.x,y:tr.y,vx:Math.cos(a2)*95,vy:Math.sin(a2)*95,life:0.6,col:'rgba(210,232,255,0.9)',r:rand(2,3)}); }
          caption('narr','You fled the snare — well done!'); setTimeout(function(){ if(!G.done) caption(); },1600); }
        tr.warnT=Math.max(0,tr.warnT-dt);
      }
      continue;
    }
    if(inZone){
      tr.warnT+=dt;
      if(G.dim){ tr.armed=false; tr.shieldT=1; sfx.shield(); caption('narr','The Light is with you — the gloom cannot harm.'); setTimeout(function(){ if(!G.done) caption(); },1800); continue; }

      if(I.act){ tr.armed=false; tr.shieldT=1; G.light=clamp(G.light+0.02,0,1); sfx.shield(); shake=5;
        for(var q=0;q<16;q++){ var a=q/16*TAU; addPart({x:car.x,y:car.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120,life:0.6,col:'rgba(255,240,180,0.9)',r:rand(2,3)}); }

  for(var k=0;k<G.people.length;k++){ var pp=G.people[k]; if(pp.reached && pp.bloom<1) pp.bloom=Math.min(1,pp.bloom+dt*1.6); }

  var cx=W*0.5, cy=36, rad=22; ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,rad,Math.PI,TAU); ctx.stroke();
  var sa=Math.PI+G.sun*Math.PI, sx=cx+Math.cos(sa)*rad, sy=cy+Math.sin(sa)*rad; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=G.evening?'rgba(200,210,255,0.9)':'rgba(255,230,150,0.95)'; ctx.beginPath(); ctx.arc(sx,sy,6,0,TAU); ctx.fill(); ctx.restore();
  drawRoster();
}
function drawRoster(){                                       // TV-mode couch roster: one coloured chip per player
  var ps=activePlayers(); if(!TV && ps.length<2) return;
  var node=(!G.praying)&&nearNode();
  var own=node?(node.type==='person'?'Hugger':((node.type==='depot'||node.type==='truck')?'Loader':(node.type==='station'?'Watchman':null))):null;
  var ch=28, capClear=Math.max(0,(95-offY)/scale), yy=H-38-capClear;     // letterboxed → bottom; exact 16:9 → rise to clear the KJV caption
  var n=ps.length, cw=138, gap=9, tot=n*cw+(n-1)*gap, bsx=clamp((W-tot)/2,10,W-tot-10);
  for(var i=0;i<n;i++){ var p=ps[i], bx=bsx+i*(cw+gap); ctx.save();
    ctx.fillStyle='rgba(8,12,22,0.78)'; rr(bx,yy,cw,ch,8); ctx.fill();
    var pulse=(p.seat===own)||(p.seat==='Driver' && (Math.abs(car.vx)+Math.abs(car.vy))>30);
    if(pulse){ ctx.strokeStyle=p.col.hue; ctx.lineWidth=2.4; ctx.globalAlpha=0.55+0.4*Math.sin(t*6); rr(bx+1,yy+1,cw-2,ch-2,7); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.fillStyle=p.col.hue; ctx.beginPath(); ctx.arc(bx+15,yy+14,7.5,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillStyle='#eef3ff'; ctx.font='800 12px Inter,sans-serif'; ctx.fillText(p.seat, bx+29, yy+10);
    ctx.fillStyle='#9fb2d8'; ctx.font='700 10px Inter,sans-serif'; ctx.fillText((p.pad!=null?('P'+(p.idx+1)):((p.touch&&p.kb)?'You':(p.kb?'Keys':'Touch')))+'  ✝'+p.reached, bx+29, yy+21);
    ctx.restore();
  }
  if(TV && n<MAXP){ ctx.save(); ctx.globalAlpha=0.5+0.25*Math.sin(t*3); ctx.fillStyle='#cfe0ff'; ctx.font='700 12px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText('press Ⓐ on a controller to join', W*0.5, yy-8); ctx.restore(); ctx.textAlign='left'; }
  ctx.textBaseline='alphabetic';
}
function drawPrayer(){
  ctx.fillStyle='rgba(6,10,22,0.55)'; ctx.fillRect(0,0,W,H);
  var cx=W*0.5, cy=H*0.52, br=40+Math.sin(t*1.1)*18+G.prayT*30;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.strokeStyle='rgba(190,215,255,0.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,br,0,TAU); ctx.stroke(); ctx.fillStyle=rgrad(cx,cy,2,br,[[0,'rgba(190,215,255,0.25)'],[1,'rgba(190,215,255,0)']]); ctx.beginPath(); ctx.arc(cx,cy,br,0,TAU); ctx.fill(); ctx.restore();
  ctx.fillStyle='#cfe0ff'; ctx.font='italic 700 15px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText(G.prayLabel||'Breathe, and pray like Daniel…', cx, cy+br+28);
  ctx.fillStyle='#8fb0e8'; ctx.font='700 12px Inter,sans-serif'; ctx.fillText((padSeen?'hold Ⓐ':(isTouch?'hold ✦':'hold Space'))+' to pray  ·  '+Math.round(G.prayT*100)+'%', cx, cy+br+48); ctx.textAlign='left';
}
function render(dt){
  ctx.clearRect(-offX/scale,-offY/scale,W+Math.abs(offX)/scale*2,H+Math.abs(offY)/scale*2);
  ctx.fillStyle='#05080f'; ctx.fillRect(0,0,W,H);
  if(shake>0){ ctx.save(); ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake=Math.max(0,shake-dt*30); }
  drawGround(); drawRoads(); drawProps(); drawRibbon(); drawGate(); drawLions();
  for(var i=0;i<G.traps.length;i++) drawTrap(G.traps[i]);
  drawDepot(); drawTruckDepot(); if(G.signpost) drawSignpost();
  for(var s=0;s<G.stations.length;s++) drawStation(G.stations[s]);
  for(var i=0;i<G.people.length;i++) drawPerson(G.people[i]);
  drawCompanion(); drawParts(); drawVehicle();
  if(shake>0) ctx.restore();
  drawHUD();
  var node=!G.praying && nearNode();
  if(node){ var txt=node.type==='depot'?'Load Bibles':node.type==='truck'?'Bring the big truck':node.type==='station'?'Stop and pray':(G.cargo>0?'Give a Bible & a hug':'(no Bibles — go to the depot)'); promptBtn(txt); }
  if(G.praying) drawPrayer();
  if(!G.started && t2<7 && !G.praying){ smallHint(padSeen?'Stick to drive · Ⓐ to act':(isTouch?'Arrows to drive · ✦ to act':'Arrows / WASD to drive · Space to act')); }
}
var t2=0;
function promptBtn(txt){ ctx.save(); ctx.globalAlpha=0.7+0.3*Math.sin(t*5); ctx.fillStyle='#fff'; ctx.font='800 '+(TV?18:15)+'px Inter,sans-serif'; ctx.textAlign='center'; ctx.shadowColor='#000'; ctx.shadowBlur=8; ctx.fillText((padSeen?'Ⓐ  ':(isTouch?'✦  ':'[Space]  '))+txt, car.x, car.y+36); ctx.restore(); ctx.textAlign='left'; }
function smallHint(txt){ ctx.save(); ctx.globalAlpha=0.8; ctx.fillStyle='#dfe8ff'; ctx.font='700 14px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText(txt,W*0.5,H*0.52); ctx.restore(); ctx.textAlign='left'; }

/* ============================================================================
   FLOW
   ============================================================================ */
var scrEl=document.getElementById('screen'), scrTitle=document.getElementById('scrTitle'), scrText=document.getElementById('scrText'), scrBtn=document.getElementById('scrBtn'), scrHint=document.getElementById('scrHint');
var mode='title';
function showTitle(){ mode='title'; PROG.souls=0; scrTitle.innerHTML='Racing for Jesus<small>Acts I–II · The Great Commission Road</small>';
  scrText.innerHTML="You are sent, like the disciples, to carry the Word to the world. <b>Load Bibles</b>, drive to each house, and <b>give a Bible &amp; a hug</b> — the right Word of God rises. Watch the grey land <b>bloom to gold</b>. Stop to <b>pray like Daniel</b>, <b>plead the Blood of Jesus</b> past the gloom, bring the <b>Gospel Truck</b> when there is much to carry — and walk <b>Abraham’s road</b> and <b>Joseph’s Egypt</b>, where even the betrayed are forgiven.<br><br><b>1–8 players, together</b> — one shared vehicle, every child a seat. The little ones are never stuck; the helpers fill in.";
  scrBtn.textContent='▶ Go ye'; scrHint.textContent='1–8 players · controller, keyboard or touch · press Ⓐ / Space to join &amp; play'; scrEl.classList.add('on'); }
function startScene(i){ if(humanCount()===0) ensureLocalPlayer(); scrEl.classList.remove('on'); buildScene(i); t2=0;
  caption('word', G.cfg.open.text, G.cfg.open.ref);
  setTimeout(function(){ if(!G.done) caption('narr', G.intro); },4200);
  setTimeout(function(){ if(G.done) return; G.started=true;      // reliable latch — the AI net depends on it, so set it regardless of early deliveries
    if(G.souls===0){ caption(); if(G.gate && G.mandatoryHint){ caption('narr', G.mandatoryHint); setTimeout(function(){ if(!G.done) caption(); },3400); } } },9000); }
function winScene(){ if(G.done) return; G.done=true; sfx.win(); caption();
  for(var q=0;q<40;q++) addPart({x:rand(0,W),y:rand(0,H),vy:rand(-120,-20),vx:rand(-60,60),grav:120,life:1.8,col:(q%2?'rgba(242,201,76,0.9)':'rgba(255,255,255,0.9)'),r:rand(2,4)});
  if(G.cfg.forgive) caption('narr','And Joseph forgave his brethren, and kissed them — God turned it all to good.');
  var wv=G.cfg.winRef, A=actOf(sceneIdx), lt=A.end-A.start+1, ln=sceneIdx-A.start+1;
  var isGameLast=(sceneIdx>=SCENES.length-1), isActLast=(sceneIdx===A.end);
  setTimeout(function(){
    if(isGameLast){ mode='actdone'; scrTitle.innerHTML='All Nations Fed<small>Act II complete</small>';
      scrText.innerHTML="Bread for all the world, and the brothers forgiven — "+PROG.souls+" souls reached across twenty scenes, the whole land turned to colour. <b>\""+wv.text+"\" ("+wv.ref+")</b><br><br><i>Act III — Jabez’s Widening Fields &amp; the Harvest — is being built next.</i>";
      scrBtn.textContent='▶ Play from the start'; scrHint.textContent='More of the road is coming';
    } else if(isActLast){ mode='actcont'; var nA=actOf(sceneIdx+1);
      scrTitle.innerHTML='Act '+A.roman+' complete<small>'+A.name+'</small>';
      scrText.innerHTML="<b>\""+wv.text+"\" ("+wv.ref+")</b><br><br>"+PROG.souls+" souls reached so far — the journey goes on. <i>Next: Act "+nA.roman+" — "+nA.name+"</i>";
      scrBtn.textContent='▶ Begin Act '+nA.roman; scrHint.textContent='Scene '+(sceneIdx+2)+' of '+SCENES.length;
    } else { mode='next'; scrTitle.innerHTML=G.title+'<small>Scene '+ln+' of '+lt+' complete</small>';
      scrText.innerHTML="<b>\""+wv.text+"\" ("+wv.ref+")</b><br><br>"+PROG.souls+" souls reached so far. <i>Next: "+SCENES[sceneIdx+1].title+"</i>";
      scrBtn.textContent='▶ Continue'; scrHint.textContent='Act '+A.roman+' · scene '+(ln+1)+' of '+lt;
    }
    scrEl.classList.add('on');
  }, 2100);
}
scrBtn.addEventListener('click',function(){ actx();
  if(mode==='title') startScene(0);
  else if(mode==='next') startScene(sceneIdx+1);
  else if(mode==='actcont') startScene(sceneIdx+1);
  else if(mode==='actdone') { showTitle(); }
});
addEventListener('keydown',function(e){ if(scrEl.classList.contains('on') && ['Enter','NumpadEnter','Space','KeyF'].indexOf(e.code)>=0){ e.preventDefault(); scrBtn.click(); } });

/* ---------- main loop ---------- */
function pollMenu(){ pollJoins();                               // controllers can join AND drive the menus
  var gs=readPads();
  for(var i=0;i<gs.length;i++){ var gp=gs[i]; if(!gp) continue; if(!claimedPad(i)) continue;
    var e0=padEdge('m'+i,gp,0), e9=padEdge('m'+i,gp,9); if(e0||e9){ scrBtn.click(); break; } }
}
buildScene(0); showTitle();
var last=performance.now();
function loop(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt; t2+=dt;
  updateParts(dt);
  if(scrEl.classList.contains('on')){ pollMenu(); render(dt); requestAnimationFrame(loop); return; }
  if(!G.done) update(dt); else readTeam();
  render(dt); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
