/* ============================================================================
   RACING FOR JESUS — "The Gospel Truck"
   A VISIBLE two-player couch co-op: you SEE two little helpers load the big
   Gospel Truck together (one reaches the high shelf, one carries to the bed),
   then ride out and give each person a hug + the Word. Oblique 3/4 "storybook"
   view, cel-shaded. Child-safe (ages ~4-8): no death; the enemy is only
   darkness that recedes as the light grows. AI fills the 2nd helper for a solo
   child (never stuck), pre-empted the instant a real player acts.
   GUARDRAIL: real KJV shown DISTINCT (gold Cinzel + ✦ + ref, caption('word'));
   invented narration stays plain (caption('narr')). © 2026 Taiwo Adegoke.
   ============================================================================ */
var W=960, H=540;
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var scale=1, offX=0, offY=0;
function resize(){ var vw=window.innerWidth, vh=window.innerHeight; scale=Math.min(vw/W,vh/H); var dw=W*scale,dh=H*scale; offX=(vw-dw)/2; offY=(vh-dh)/2; cv.width=Math.round(vw*DPR); cv.height=Math.round(vh*DPR); cv.style.width=vw+'px'; cv.style.height=vh+'px'; document.getElementById('rotate').classList.toggle('on', vh>vw*1.15 && vw<620); }
window.addEventListener('resize',resize); resize();
function applyCam(){ ctx.setTransform(scale*DPR,0,0,scale*DPR, offX*DPR, offY*DPR); }

/* ---------- helpers ---------- */
var TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function vgrad(x0,y0,x1,y1,st){ var g=ctx.createLinearGradient(x0,y0,x1,y1); for(var i=0;i<st.length;i++) g.addColorStop(st[i][0],st[i][1]); return g; }
function rgrad(x,y,r0,r1,st){ var g=ctx.createRadialGradient(x,y,r0,x,y,r1); for(var i=0;i<st.length;i++) g.addColorStop(st[i][0],st[i][1]); return g; }
function rr(x,y,w,h,r){ if(r>Math.min(w,h)/2) r=Math.min(w,h)/2; ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillrr(x,y,w,h,r){ rr(x,y,w,h,r); ctx.fill(); }
function mixHex(a,b,k){ k=clamp(k,0,1); return 'rgb('+[0,1,2].map(function(i){ return Math.round(lerp(parseInt(a.substr(1+i*2,2),16),parseInt(b.substr(1+i*2,2),16),k)); }).join(',')+')'; }
function shade(hex,k){ /* k>0 lighten toward white, k<0 darken toward black */ return k>=0?mixHex(hex,'#ffffff',k):mixHex(hex,'#000000',-k); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
var reducedMotion=false;

/* cel-shade panel — the "effort look" lever: midtone + top light band + bottom shade + optional rim */
function panel(x,y,w,h,r,base,glow){
  ctx.fillStyle=base; fillrr(x,y,w,h,r);
  ctx.save(); rr(x,y,w,h,r); ctx.clip();
  ctx.fillStyle=shade(base,0.26); ctx.fillRect(x,y,w,h*0.34);
  ctx.fillStyle=shade(base,-0.22); ctx.fillRect(x,y+h*0.72,w,h*0.28);
  ctx.restore();
  if(glow>0){ ctx.save(); ctx.globalAlpha=glow*0.8; ctx.strokeStyle='#ffe9b0'; ctx.lineWidth=1.6; rr(x+0.8,y+0.8,w-1.6,h-1.6,r); ctx.stroke(); ctx.restore(); }
}

/* ---------- audio ---------- */
var AC=null;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,ty,v,sl){ var a=actx(); if(!a) return; var o=a.createOscillator(), g=a.createGain(); o.type=ty||'sine'; o.frequency.value=f; if(sl) o.frequency.exponentialRampToValueAtTime(sl,a.currentTime+d); g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(v||0.2,a.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+0.02); }
function noiseBurst(d,v,lp){ var a=actx(); if(!a) return; var n=a.createBufferSource(), buf=a.createBuffer(1,a.sampleRate*d,a.sampleRate), da=buf.getChannelData(0); for(var i=0;i<da.length;i++) da[i]=(Math.random()*2-1)*(1-i/da.length); n.buffer=buf; var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1200; var g=a.createGain(); g.gain.value=v||0.2; g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+d); n.connect(f); f.connect(g); g.connect(a.destination); n.start(); }
var sfx={
  pick:function(){ tone(520,0.06,'triangle',0.06,720); },
  thud:function(){ noiseBurst(0.09,0.08,420); tone(190,0.12,'sine',0.08,120); },
  reach:function(){ tone(680,0.08,'sine',0.06,980); },
  deliver:function(){ tone(760,0.09,'square',0.07,1180); setTimeout(function(){tone(1180,0.1,'square',0.05);},70); },
  bless:function(){ [660,880,1320].forEach(function(f,i){ setTimeout(function(){tone(f,0.5,'sine',0.09);},i*90); }); },
  hug:function(){ tone(520,0.18,'sine',0.07,620); },
  full:function(){ [440,660,880].forEach(function(f,i){ setTimeout(function(){tone(f,0.3,'triangle',0.09);},i*80); }); noiseBurst(0.2,0.05,900); },
  truck:function(){ tone(150,0.32,'sawtooth',0.07,110); noiseBurst(0.3,0.05,380); },
  pray:function(){ tone(523,0.6,'sine',0.1); setTimeout(function(){tone(784,0.7,'sine',0.08);},150); setTimeout(function(){tone(1047,0.8,'sine',0.06);},300); },
  win:function(){ [523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){tone(f,0.5,'sine',0.1);},i*130); }); }
};

/* ---------- caption (the guardrail) ---------- */
var capEl=document.getElementById('cap'), capInner=document.getElementById('capInner');
function caption(kind,text,ref){ if(!text){ capEl.classList.remove('on'); return; } if(kind==='word') capInner.innerHTML='<span class="word">'+text+'</span>'+(ref?'<span class="ref">'+ref+'</span>':''); else capInner.innerHTML='<span class="narr">'+text+'</span>'; capEl.classList.add('on'); }
function captionTimed(kind,text,ref,ms){ caption(kind,text,ref); var id=++capToken; setTimeout(function(){ if(capToken===id && !G.done) caption(); },ms||2600); }
var capToken=0;

   REAL KJV (public domain, exact) — the Word given, by feeling.
   ============================================================================ */

  forgotten:{text:'Behold, I have graven thee upon the palms of my hands; thy walls are continually before me.', ref:'Isaiah 49:16'}
};
var FEEL_LABEL={afraid:'afraid',sad:'sad',troubled:'troubled',weary:'weary',lonely:'lonely',worried:'worried',ashamed:'ashamed',hopeless:'hopeless',sick:'hurting',unloved:'unloved',overwhelmed:'overwhelmed',confused:'confused',inneed:'in need',small:'small',betrayed:'betrayed',forgotten:'forgotten'};

/* ============================================================================
   INPUT + COUCH CO-OP  (join plumbing adapted from david-coop; roles STRONG/LIGHT)
   ============================================================================ */
var keys={};
addEventListener('keydown',function(e){ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>=0) e.preventDefault(); actx();
  if(humanCount()===0 && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space','KeyF','KeyE','Enter'].indexOf(e.code)>=0) ensureLocalPlayer(); });
addEventListener('keyup',function(e){ keys[e.code]=false; });
var touchV={x:0,y:0,act:false};
function readPads(){ return (navigator.getGamepads&&navigator.getGamepads())||[]; }
var padSeen=false, TV=false, prevPad={};
var MAXP=8;
var ROLECOL={strong:'#e6513f', light:'#f2a93e'};
var players=[];
function activePlayers(){ return players.filter(function(p){ return !p.inactive; }); }
function humanCount(){ return activePlayers().length; }
function roleTaken(role){ for(var i=0;i<players.length;i++){ if(!players[i].inactive && players[i].role===role) return players[i]; } return null; }
function nextRole(){ if(!roleTaken('strong')) return 'strong'; if(!roleTaken('light')) return 'light'; return 'strong'; }
function addPlayer(opts){ opts=opts||{}; if(humanCount()>=MAXP) return null;
  var role=opts.role||nextRole();
  var p={ idx:players.length, role:role, pad:(opts.pad!=null?opts.pad:null), kb:!!opts.kb, touch:!!opts.touch, padId:opts.padId||'', inactive:false, reached:0, _actPrev:true };
  players.push(p); return p;
}
function ensureLocalPlayer(){ for(var i=0;i<players.length;i++){ if(!players[i].inactive && (players[i].kb||players[i].touch)) return players[i]; } return addPlayer({kb:true,touch:true,role:'strong'}); }
function padPressed(gp,i){ return !!(gp&&gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5)); }
function padEdge(key,gp,i){ var k=key+':'+i, now=padPressed(gp,i), was=prevPad[k]; prevPad[k]=now; return now&&!was; }
function claimedPad(i){ for(var k=0;k<players.length;k++){ if(!players[k].inactive && players[k].pad===i) return true; } return false; }
function pollJoins(){ var gs=readPads();
  for(var i=0;i<gs.length && i<MAXP;i++){ var gp=gs[i]; if(!gp) continue; padSeen=true; TV=true;
    if(claimedPad(i)) continue;
    var join=padPressed(gp,0)||padPressed(gp,1)||padPressed(gp,2)||padPressed(gp,3)||Math.abs(gp.axes[0]||0)>0.5||Math.abs(gp.axes[1]||0)>0.5||padPressed(gp,12)||padPressed(gp,13)||padPressed(gp,14)||padPressed(gp,15);
    if(!join) continue;
    var ex=null; for(var r=0;r<players.length;r++){ if(players[r].inactive && players[r].padId && players[r].padId===gp.id){ ex=players[r]; break; } }
    if(ex){ if(humanCount()>=MAXP) continue; ex.inactive=false; ex.pad=i; ex._actPrev=true; if(roleTaken(ex.role) && roleTaken(ex.role)!==ex) ex.role=nextRole(); }
    else { var np=addPlayer({pad:i,padId:gp.id}); if(np) np._actPrev=true; }
    prevPad['m'+i+':0']=true; prevPad['m'+i+':9']=true; actx();
  }
}
addEventListener('gamepadconnected',function(){ TV=true; padSeen=true; });
addEventListener('gamepaddisconnected',function(e){ for(var i=0;i<players.length;i++){ if(players[i].pad===e.gamepad.index){ players[i].inactive=true; players[i].pad=null; } } });
function readPlayer(p){ var dx=0,dy=0,act=false;
  if(p.kb){ if(keys['ArrowLeft']||keys['KeyA'])dx-=1; if(keys['ArrowRight']||keys['KeyD'])dx+=1; if(keys['ArrowUp']||keys['KeyW'])dy-=1; if(keys['ArrowDown']||keys['KeyS'])dy+=1; if(keys['Space']||keys['KeyF']||keys['KeyE']||keys['Enter'])act=true; }
  if(p.touch){ dx+=touchV.x; dy+=touchV.y; if(touchV.act)act=true; }
  if(p.pad!=null){ var gp=readPads()[p.pad]; if(gp){ var ax=gp.axes[0]||0, ay=gp.axes[1]||0; if(Math.abs(ax)>0.3)dx+=ax; if(Math.abs(ay)>0.3)dy+=ay;
    if(padPressed(gp,14))dx-=1; if(padPressed(gp,15))dx+=1; if(padPressed(gp,12))dy-=1; if(padPressed(gp,13))dy+=1;
    if(padPressed(gp,0)||padPressed(gp,1)||padPressed(gp,2))act=true; } }
  var m=Math.hypot(dx,dy); if(m>1){ dx/=m; dy/=m; }
  var edge=act&&!p._actPrev; p._actPrev=act;
  return {dx:dx,dy:dy,act:act,actEdge:edge};
}
function playerForRole(role){ for(var i=0;i<players.length;i++){ if(!players[i].inactive && players[i].role===role) return players[i]; } return null; }

var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
function setupTouch(){

  function mk(html,css){ var b=document.createElement('div'); b.className='tbtn'; b.style.cssText='width:64px;height:64px;font-size:22px;position:absolute;'+css; b.innerHTML=html; box.appendChild(b); return b; }
  function bind(el,setter){ el.addEventListener('touchstart',function(e){e.preventDefault();setter(true);actx();if(humanCount()===0)ensureLocalPlayer();},{passive:false}); el.addEventListener('touchend',function(e){e.preventDefault();setter(false);},{passive:false}); el.addEventListener('mousedown',function(e){e.preventDefault();setter(true);actx();if(humanCount()===0)ensureLocalPlayer();}); addEventListener('mouseup',function(){setter(false);}); }
  var Lf='left:calc(16px + env(safe-area-inset-left));', Rt='right:calc(16px + env(safe-area-inset-right));', b='env(safe-area-inset-bottom)';
  bind(mk('▲','left:calc(88px + env(safe-area-inset-left));bottom:calc(96px + '+b+');'),function(v){touchV.y=v?-1:0;});
  bind(mk('▼','left:calc(88px + env(safe-area-inset-left));bottom:calc(24px + '+b+');'),function(v){touchV.y=v?1:0;});
  bind(mk('◀',Lf+'bottom:calc(60px + '+b+');'),function(v){touchV.x=v?-1:0;});
  bind(mk('▶','left:calc(160px + env(safe-area-inset-left));bottom:calc(60px + '+b+');'),function(v){touchV.x=v?1:0;});
  bind(mk('✦',Rt+'bottom:calc(26px + '+b+');width:84px;height:84px;font-size:28px;background:rgba(242,193,78,.25);border-color:rgba(255,220,140,.5);'),function(v){touchV.act=v;});
  if(isTouch) box.style.display='block';
}

var ACTS=[ {roman:'I',name:'Daniel’s City of Prayer',start:0,end:9}, {roman:'II',name:'Abraham’s Road & Joseph’s Egypt',start:10,end:19} ];
function actOf(i){ for(var a=0;a<ACTS.length;a++){ if(i>=ACTS[a].start && i<=ACTS[a].end) return ACTS[a]; } return ACTS[ACTS.length-1]; }

/* ============================================================================
   WORLD LAYOUT  (world x scrolls; y is the shallow 3/4 ground band)
   ============================================================================ */
var GROUND_Y=330;            // screen y where the near ground band begins
var LANE=392;                // world y the truck/people sit on (ground contact)
var DEPOT={ shelf:{x:150,y:360}, mat:{x:300,y:402}, truck:{x:470,y:398} };
var t=0, t2=0, shake=0, parts=[];
function addPart(o){ o.age=0; o.life=o.life||1; parts.push(o); }
function updateParts(dt){ for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.age+=dt; p.x+=(p.vx||0)*dt; p.y+=(p.vy||0)*dt; if(p.grav)p.vy=(p.vy||0)+p.grav*dt; if(p.age>=p.life) parts.splice(i,1); } }
var camX=0, camTarget=0;
var G={};
var strong={}, light={};

function bodyInit(b,role,x,y){ b.role=role; b.x=x; b.y=y; b.vx=0; b.vy=0; b.state='idle'; b.facing=1; b.holding=false; b.anim=0; b.strain=0; }

function buildScene(i){
  sceneIdx=i; var s=SCENES[i];
  var n=s.people.length;
  var startX=720, gap=clamp(1100/Math.max(1,n), 150, 240);
  var people=s.people.map(function(feel,k){ return { feel:feel, x:startX+k*gap, y:(k%2?LANE-36:LANE+6), reached:false, hugged:false, worded:false, bloom:0, bob:rand(0,TAU) }; });
  var worldEnd=startX+(n-1)*gap+320;
  var cratesTarget=clamp(Math.ceil(n/2),3,6);
  G={ cfg:s, title:s.title, sub:s.sub, intro:s.intro,
    phase:'load', people:people, total:n, worldEnd:worldEnd,
    cratesTarget:cratesTarget, loaded:0, cargo:0, crates:[], golden:null, coLift:null,
    souls:0, light:0, done:false, started:false, idle:0,
    dim:!!s.dim, desert:!!s.desert, finale:!!s.finale, forgive:!!s.forgive,
    pray:!!s.pray, prayDone:false, praying:false, prayT:0, prayMin:0, seek:!!s.seek,
    prayX:(s.pray? startX-120 : 0), prayGateOpen:!s.pray,
    snares: s.snares? [] : null,
    msg:'', msgT:0 };
  if(s.snares){ for(var q=0;q<3;q++) G.snares.push({ x:startX+120+q*260, y:LANE+(q%2?-30:20), r:40, armed:true, warnT:0, shieldT:0 }); }
  bodyInit(strong,'strong',260,370); bodyInit(light,'light',200,418);
  camX=0; camTarget=0; capToken++;
}
var sceneIdx=0;

/* ---------- node helpers ---------- */
function dropCrate(){ if(G.loaded+G.crates.length>=G.cratesTarget) return false;
  G.crates.push({ x:DEPOT.mat.x+rand(-14,14), y:DEPOT.mat.y, z:40, vz:0, state:'fall', held:false }); sfx.reach(); return true; }
function matCrate(){ for(var i=0;i<G.crates.length;i++){ if(!G.crates[i].held && G.crates[i].state==='rest') return G.crates[i]; } return null; }

/* ============================================================================
   PHASE A — LOAD THE TRUCK TOGETHER
   ============================================================================ */
function bodyAct(b, env){            // env = {dx,dy,act,actEdge} from a player OR the AI
  var sp=168, ax=env.dx*sp, ay=env.dy*sp*0.72;
  b.vx=lerp(b.vx,ax,0.35); b.vy=lerp(b.vy,ay,0.35);
  b.x=clamp(b.x+b.vx*(1/60),60,900); b.y=clamp(b.y+b.vy*(1/60),344,452);
  var moving=Math.abs(b.vx)+Math.abs(b.vy)>12; if(Math.abs(b.vx)>8) b.facing=b.vx>0?1:-1;
  b.anim+=(moving?6:2)*(1/60);
  b.state= b.holding?'carry':(moving?'walk':'idle');
  if(b.holding) b.strain=lerp(b.strain,1,0.1); else b.strain=lerp(b.strain,0,0.2);
}
function nearShelf(b){ return dist(b.x,b.y,DEPOT.shelf.x,DEPOT.shelf.y+18)<62; }
function nearMat(b){ return dist(b.x,b.y,DEPOT.mat.x,DEPOT.mat.y)<66; }
function nearTruckBed(b){ return dist(b.x,b.y,DEPOT.truck.x-14,DEPOT.truck.y)<70; }
function doStrongAct(){                 // STRONG: pick up at mat / heave into bed
  if(strong.holding){ if(nearTruckBed(strong)){ strong.holding=false; depositCrate(); return true; } }
  else { var c=matCrate(); if(c && dist(strong.x,strong.y,c.x,c.y)<64){ c.held=true; c.state='carried'; strong.holding=true; sfx.pick(); return true; } }
  return false;
}
function doLightAct(){                   // LIGHT: reach the high shelf → a crate slides to the mat
  if(nearShelf(light)){ if(dropCrate()){ light.state='reach'; light.anim=0; return true; } }
  return false;
}
function depositCrate(){                 // a carried crate goes into the bed
  for(var i=0;i<G.crates.length;i++){ if(G.crates[i].held){ G.crates.splice(i,1); break; } }
  G.loaded++; var per=Math.ceil(G.total/G.cratesTarget); G.cargo=Math.min(G.total, G.cargo+per);
  sfx.thud(); shake=reducedMotion?0:3; truckDip=1;
  for(var q=0;q<8;q++) addPart({x:DEPOT.truck.x-14,y:LLy(DEPOT.truck.y)-30,vx:rand(-50,50),vy:rand(-120,-30),grav:260,life:0.7,col:'rgba(210,190,150,0.9)',r:rand(2,3)});
  if(G.loaded>=G.cratesTarget) startCoLift();
}
var truckDip=0;
function startCoLift(){ if(G.golden||G.coLift) return;
  G.golden={ x:DEPOT.mat.x, y:DEPOT.mat.y, z:6, progress:0, sHeld:false, lHeld:false };
  captionTimed('narr','One big golden case is left — carry it together to the truck!',null,3600);
}
function coLiftUpdate(sEnv,lEnv){ var g=G.golden; if(!g) return;
  var sNear=dist(strong.x,strong.y,g.x,g.y)<70, lNear=dist(light.x,light.y,g.x,g.y)<70;
  g.sHeld = sNear; g.lHeld = lNear;
  if(g.sHeld && g.lHeld){                               // glued glide at the slower pace, toward the truck
    strong.holding=true; light.holding=true; strong.state='carry'; light.state='carry';
    var tx=DEPOT.truck.x-14, ty=DEPOT.truck.y;
    var push = ((sEnv.dx>0?1:0)+(lEnv.dx>0?1:0));       // both pushing truckward
    var spd = push>=1 ? 46 : 14;
    g.x=lerp(g.x,tx,0.02+0.0006*spd); g.y=lerp(g.y,ty,0.03);
    g.progress=clamp((g.x-DEPOT.mat.x)/((DEPOT.truck.x-14)-DEPOT.mat.x),0,1);
    strong.x=lerp(strong.x,g.x-18,0.2); strong.y=lerp(strong.y,g.y+6,0.2);
    light.x=lerp(light.x,g.x+18,0.2); light.y=lerp(light.y,g.y+6,0.2);
    if(dist(g.x,g.y,tx,ty)<22){ finishCoLift(); }
  } else { strong.holding=false; light.holding=false; }
}
function finishCoLift(){ G.golden=null; G.cargo=G.total; strong.holding=false; light.holding=false;
  sfx.full(); shake=reducedMotion?0:4; truckDip=1.4;
  for(var q=0;q<30;q++) addPart({x:DEPOT.truck.x-14,y:LLy(DEPOT.truck.y)-34,vx:rand(-90,90),vy:rand(-180,-40),grav:200,life:1.3,col:(q%2?'rgba(255,220,140,0.95)':'rgba(255,255,255,0.9)'),r:rand(2,4)});
  G.msg='TRUCK FULL!'; G.msgT=1.6;
  captionTimed('narr','The truck is full — now ride out and carry the Word!',null,3200);
  setTimeout(function(){ if(!G.done) toRide(); },1400);
}
function toRide(){ G.phase='ride'; strong.x=DEPOT.truck.x; strong.y=DEPOT.truck.y; light.x=DEPOT.truck.x; light.y=DEPOT.truck.y;
  truck.x=DEPOT.truck.x; truck.y=LANE; truck.vx=0; truck.vy=0; truck.ang=0; }
var truck={x:470,y:LANE,vx:0,vy:0,ang:0};
function LLy(worldY){ return worldY; }   // (ground y already in screen space for our shallow tilt)
var PROG={souls:0};
var ZERO={dx:0,dy:0,act:false,actEdge:false};

/* ---------- the AI net (fills an empty/idle role; a human press pre-empts) ---------- */
function toward(b,tx,ty,atAct){ var dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1; var e=d<34?d/34:1; return {dx:dx/d*e,dy:dy/d*e,act:!!atAct,actEdge:false}; }
function idleNear(b,tx,ty){ var dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy); if(d<28) return ZERO; return {dx:dx/d*0.5,dy:dy/d*0.5,act:false,actEdge:false}; }
function nearestUndelivered(flag){ var best=null,bd=1e9; for(var i=0;i<G.people.length;i++){ var p=G.people[i]; if(p.reached||p[flag]) continue; var d=Math.abs(truck.x-p.x); if(d<bd){bd=d;best=p;} } return best; }
function nearPerson(){ var best=null,bd=74; for(var i=0;i<G.people.length;i++){ var p=G.people[i]; if(p.reached) continue; var d=dist(truck.x,truck.y,p.x,p.y); if(d<bd){bd=d;best=p;} } return best; }
function aiPlan(role,phase){ var b=role==='strong'?strong:light;
  if(phase==='loadGold'){ var g=G.golden; if(!g) return ZERO; var hx=role==='strong'?g.x-16:g.x+16, hy=g.y+8; if(dist(b.x,b.y,hx,hy)<20) return {dx:0.7,dy:0,act:false,actEdge:false}; return toward(b,hx,hy,false); }
  if(phase==='load'){
    if(role==='light'){ var need=(G.loaded+G.crates.length)<G.cratesTarget; if(need && G.crates.length<3) return toward(b,DEPOT.shelf.x,DEPOT.shelf.y+18, nearShelf(b)); return idleNear(b,DEPOT.shelf.x+34,DEPOT.shelf.y+34); }
    if(b.holding) return toward(b,DEPOT.truck.x-14,DEPOT.truck.y, nearTruckBed(b)); var c=matCrate(); if(c) return toward(b,c.x,c.y, dist(b.x,b.y,c.x,c.y)<58); return idleNear(b,DEPOT.mat.x+40,DEPOT.mat.y);
  }
  // ride
  if(role==='strong'){ if(G.pray && !G.prayDone){ var near=Math.abs(truck.x-G.prayX)<40; return driveToward(G.prayX,LANE, near); }
    var p=nearestUndelivered('worded'); if(p) return driveToward(p.x,p.y, dist(truck.x,truck.y,p.x,p.y)<60 && G.cargo>0); return ZERO; }
  var ph=nearestUndelivered('hugged'); if(ph) return {dx:0,dy:0,act:dist(truck.x,truck.y,ph.x,ph.y)<66,actEdge:false}; return ZERO;
}
function driveToward(tx,ty,atAct){ var dx=tx-truck.x,dy=ty-truck.y,d=Math.hypot(dx,dy)||1; var e=d<70?Math.max(0.35,d/120):1; return {dx:dx/d*e,dy:dy/d*e,act:!!atAct,actEdge:false}; }
function roleInput(role){ var dx=0,dy=0,act=false,actEdge=false,any=false;
  for(var i=0;i<players.length;i++){ var p=players[i]; if(p.inactive||p.role!==role||!p._read) continue; any=true; var r=p._read; dx+=r.dx; dy+=r.dy; if(r.act)act=true; if(r.actEdge)actEdge=true; }
  var m=Math.hypot(dx,dy); if(m>1){dx/=m;dy/=m;} return {any:any, env:{dx:dx,dy:dy,act:act,actEdge:actEdge}};
}
function roleEnv(role,phase){ var ri=roleInput(role);          // ALL humans in a role co-drive; extras assist, none shadowed
  if(ri.any){ if(Math.hypot(ri.env.dx,ri.env.dy)>0.08||ri.env.act) return {env:ri.env,byAI:false}; if(G.idle<1.4) return {env:ZERO,byAI:false}; }
  return {env:aiPlan(role,phase),byAI:true};
}
function anyAct(){ for(var i=0;i<players.length;i++){ var p=players[i]; if(!p.inactive && p._read && p._read.act) return true; } return false; }
function anyActEdge(){ for(var i=0;i<players.length;i++){ var p=players[i]; if(!p.inactive && p._read && p._read.actEdge) return true; } return false; }

/* ---------- PHASE A step ---------- */
function updateCrates(dt){ for(var i=0;i<G.crates.length;i++){ var c=G.crates[i]; if(c.held)continue; if(c.state==='fall'){ c.vz-=300*dt; c.z+=c.vz*dt; if(c.z<=0){ c.z=0;c.vz=0;c.state='rest'; sfx.thud(); for(var q=0;q<5;q++) addPart({x:c.x,y:DEPOT.mat.y,vx:rand(-30,30),vy:rand(-40,-10),grav:200,life:0.5,col:'rgba(210,190,150,0.8)',r:rand(1.5,2.5)}); } } } }
function stepLoad(dt){ strong.aiCd=Math.max(0,(strong.aiCd||0)-dt); light.aiCd=Math.max(0,(light.aiCd||0)-dt);
  if(G.golden){ handleGolden(dt); updateCrates(dt); return; }
  var L=roleEnv('light','load'); bodyAct(light,L.env);
  if(!L.byAI){ if(L.env.actEdge) doLightAct(); } else if(L.env.act && light.aiCd<=0){ if(doLightAct()) light.aiCd=0.55; }
  var S=roleEnv('strong','load'); bodyAct(strong,S.env);
  if(!S.byAI){ if(S.env.actEdge) doStrongAct(); } else if(S.env.act && strong.aiCd<=0){ if(doStrongAct()) strong.aiCd=0.45; }
  updateCrates(dt);
}
function handleGolden(dt){ var g=G.golden; var S=roleEnv('strong','loadGold'), L=roleEnv('light','loadGold');
  bodyAct(strong,S.env); bodyAct(light,L.env);
  var sNear=dist(strong.x,strong.y,g.x,g.y)<50, lNear=dist(light.x,light.y,g.x,g.y)<50;
  if(sNear&&lNear){ strong.holding=true; light.holding=true; strong.state='carry'; light.state='carry';
    var tx=DEPOT.truck.x-14, ty=DEPOT.truck.y; var push=((S.env.dx>0.1?1:0)+(L.env.dx>0.1?1:0)); var spd=push>=2?70:(push>=1?40:12);
    g.x=Math.min(tx,g.x+spd*dt*1.5); g.y=lerp(g.y,ty,0.05);
    strong.x=g.x-16; strong.y=g.y+8; light.x=g.x+16; light.y=g.y+8;
    if(g.x>=tx-2) finishCoLift();
  } else { strong.holding=false; light.holding=false; }
}

/* ---------- PHASE B/C — ride & deliver ---------- */
function driveTruck(env,dt){ var acc=640; truck.vx+=env.dx*acc*dt; truck.vy+=env.dy*acc*dt*0.7;
  if(env.actEdge && false){} truck.vx*=Math.max(0,1-3*dt); truck.vy*=Math.max(0,1-4*dt);
  var sp=Math.hypot(truck.vx,truck.vy), MAX=212; if(sp>MAX){truck.vx*=MAX/sp;truck.vy*=MAX/sp;}
  var maxX=(G.pray && !G.prayDone)? G.prayX+8 : G.worldEnd;
  truck.x=clamp(truck.x+truck.vx*dt,60,maxX); truck.y=clamp(truck.y+truck.vy*dt,LANE-42,LANE+30);
  if(truck.x>=maxX) truck.vx=Math.min(0,truck.vx);
  if(Math.abs(truck.vx)>6) truck.face=truck.vx>0?1:-1;
}
function stepRide(dt){ strong.aiCd=Math.max(0,(strong.aiCd||0)-dt); light.aiCd=Math.max(0,(light.aiCd||0)-dt);
  var S=roleEnv('strong','ride'); driveTruck(S.env,dt);
  if(G.pray && !G.prayDone && Math.abs(truck.x-G.prayX)<42){ if(anyActEdge()||G.idle>2.0) startPraying(); }
  var pers=nearPerson();
  if(pers){ var L=roleEnv('light','ride');
    var sAct=S.byAI?(S.env.act&&strong.aiCd<=0):S.env.actEdge;
    var lAct=L.byAI?(L.env.act&&light.aiCd<=0):L.env.actEdge;
    if(sAct && G.cargo>0 && !pers.worded){ handBible(pers); strong.aiCd=0.5; strong.state='deliver'; strong.animT=0.5; }
    if(lAct && !pers.hugged){ hugPerson(pers); light.aiCd=0.5; light.state='hug'; light.animT=0.5; }
  }

function drawParts(){ for(var i=0;i<parts.length;i++){ var p=parts[i]; ctx.globalAlpha=clamp(1-p.age/p.life,0,1); ctx.fillStyle=p.col||'#fff'; ctx.beginPath(); ctx.arc(SX(p.x),p.y,p.r||2,0,TAU); ctx.fill(); } ctx.globalAlpha=1; }
function drawVignette(){ ctx.save(); var a=clamp(0.42-0.26*G.light,0.08,0.42); ctx.fillStyle=rgrad(W/2,H*0.46,H*0.42,H*0.92,[[0,'rgba(0,0,0,0)'],[1,'rgba(6,8,16,'+a+')']]); ctx.fillRect(0,0,W,H); ctx.restore(); }
function drawHUD(){ var x=16,y=16,w=250,h=14; ctx.fillStyle='rgba(8,14,26,0.55)'; fillrr(x-6,y-6,w+12,h+24,8); ctx.fillStyle='#2a2c38'; fillrr(x,y,w,h,7); ctx.fillStyle=vgrad(x,0,x+w,0,[[0,'#ffe08a'],[1,'#f2a93e']]); fillrr(x,y,Math.max(6,w*G.light),h,7);
  ctx.fillStyle='#ffe9b0'; ctx.font='800 10px Inter'; ctx.fillText('KINGDOM OF GOD',x,y+h+12); ctx.fillStyle='#7c8098'; ctx.textAlign='right'; ctx.fillText('the darkness',x+w,y+h+12); ctx.textAlign='left';
  var A=actOf(sceneIdx), lt=A.end-A.start+1, ln=sceneIdx-A.start+1; ctx.fillStyle='#eaf0ff'; ctx.font='800 13px Inter'; ctx.textAlign='right'; var rt=G.phase==='load'?('Loading ✝ '+Math.min(G.cargo,G.total)+' / '+G.total):('✝ '+G.souls+' / '+G.total); ctx.fillText(rt+'   ·   Act '+A.roman+'  '+ln+'/'+lt,W-16,24); ctx.textAlign='left';
  ctx.fillStyle='rgba(220,230,255,0.9)'; ctx.font='700 13px Inter'; ctx.textAlign='center'; ctx.fillText(G.title,W*0.5,20); ctx.textAlign='left'; }
function drawContextPrompt(){ if(G.praying||G.done)return; var txt=null,ax=W*0.5,ay=H*0.5;
  if(G.phase==='load'){ if(G.golden){ txt='Carry the golden case together!'; ax=SX(G.golden.x); ay=G.golden.y-46; }
    else { var sP=playerForRole('strong'); if(strong.holding){txt='Take it to the truck';} else if(matCrate()){txt='Pick up the crate';} else {txt='Wait for a crate…';} ax=SX(strong.x); ay=strong.y-56; } }
  else { var pers=nearPerson(); if(pers){ txt=(G.cargo<=0&&!pers.worded)?'(truck empty)':'Hug & give a Bible'; ax=SX(pers.x); ay=pers.y-78; }
    else if(G.pray&&!G.prayDone&&Math.abs(truck.x-G.prayX)<48){ txt='Stop and pray'; ax=SX(G.prayX); ay=LANE-80; } }
  if(txt){ ctx.save(); ctx.globalAlpha=0.75+0.25*Math.sin(t*5); ctx.fillStyle='#fff'; ctx.font='800 14px Inter'; ctx.textAlign='center'; ctx.shadowColor='#000'; ctx.shadowBlur=8; ctx.fillText((padSeen?'Ⓐ ':(isTouch?'✦ ':'[Space] '))+txt,ax,ay); ctx.restore(); ctx.textAlign='left'; } }
function drawBigMsg(){ ctx.save(); var k=clamp(G.msgT/1.6,0,1); ctx.globalAlpha=Math.min(1,k*2.2); ctx.fillStyle='#f6d98a'; ctx.font='800 '+Math.round(42+(1-k)*8)+'px Cinzel,serif'; ctx.textAlign='center'; ctx.shadowColor='#000'; ctx.shadowBlur=14; ctx.fillText(G.msg,W/2,H*0.38); ctx.restore(); ctx.textAlign='left'; }
function drawPrayerOverlay(){ ctx.fillStyle='rgba(6,10,22,0.5)'; ctx.fillRect(0,0,W,H); var cx=W/2,cy=H*0.5, br=40+Math.sin(t*1.1)*16+G.prayT*30; ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.strokeStyle='rgba(190,215,255,0.8)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,br,0,TAU); ctx.stroke(); ctx.fillStyle=rgrad(cx,cy,2,br,[[0,'rgba(190,215,255,0.22)'],[1,'rgba(190,215,255,0)']]); ctx.beginPath(); ctx.arc(cx,cy,br,0,TAU); ctx.fill(); ctx.restore(); ctx.fillStyle='#8fb0e8'; ctx.font='700 12px Inter'; ctx.textAlign='center'; ctx.fillText((padSeen?'hold Ⓐ':(isTouch?'hold ✦':'hold Space'))+' to pray  ·  '+Math.round(G.prayT*100)+'%',cx,cy+br+28); ctx.textAlign='left'; }
function drawRoster(){ var ps=activePlayers(); if(!TV && ps.length<2) return; var roles=['strong','light'], yy=H-34, cw=150, gap=10, tot=2*cw+gap, bsx=(W-tot)/2;
  for(var i=0;i<2;i++){ var role=roles[i], p=playerForRole(role), bx=bsx+i*(cw+gap); ctx.save(); ctx.fillStyle='rgba(8,12,22,0.8)'; fillrr(bx,yy,cw,28,8); ctx.fillStyle=ROLECOL[role]; ctx.beginPath(); ctx.arc(bx+15,yy+14,7.5,0,TAU); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#eef3ff'; ctx.font='800 12px Inter'; ctx.fillText(role==='strong'?'STRONG':'LIGHT',bx+28,yy+10); ctx.fillStyle='#9fb2d8'; ctx.font='700 10px Inter'; ctx.fillText(p?(p.pad!=null?('Player '+(p.idx+1)):(p.kb?'Keys':'Touch')):'helper (auto)',bx+28,yy+21); ctx.restore(); }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic'; if(TV && ps.length<2){ ctx.save(); ctx.globalAlpha=0.5+0.25*Math.sin(t*3); ctx.fillStyle='#cfe0ff'; ctx.font='700 12px Inter'; ctx.textAlign='center'; ctx.fillText('press Ⓐ on a 2nd controller to join as LIGHT',W/2,yy-8); ctx.restore(); ctx.textAlign='left'; } }
function render(dt){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle='#05080f'; ctx.fillRect(0,0,cv.width,cv.height); applyCam();
  drawSky(); drawParallax(); drawGround();
  if(shake>0){ ctx.save(); ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake=Math.max(0,shake-dt*30); }
  var list=[]; function add(y,f){ list.push({y:y,f:f}); }
  if(G.phase==='load'){ add(DEPOT.shelf.y,drawShelf); add(DEPOT.mat.y-3,drawMat); for(var i=0;i<G.crates.length;i++){ (function(c){ add(DEPOT.mat.y, function(){drawCrate(c);}); })(G.crates[i]); } add(DEPOT.truck.y,function(){ drawTruckAt(DEPOT.truck.x,DEPOT.truck.y,-1,truckDip,G.cargo); }); if(G.golden)(function(g){ add(g.y,function(){drawGolden(g);}); })(G.golden); add(strong.y,function(){drawPlayer(strong);}); add(light.y,function(){drawPlayer(light);}); }
  else { for(var j=0;j<G.people.length;j++){ (function(p){ add(p.y,function(){drawPerson(p);}); })(G.people[j]); } if(G.snares){ for(var s=0;s<G.snares.length;s++){ (function(tr){ add(tr.y-1,function(){drawSnare(tr);}); })(G.snares[s]); } } if(G.pray&&!G.prayDone) add(LANE-2,drawPrayStation); add(truck.y+1,function(){ drawTruckAt(truck.x,truck.y,truck.face||1,truckDip,G.cargo); drawRiders(); }); }
  list.sort(function(a,b){return a.y-b.y;}); for(var k=0;k<list.length;k++) list[k].f();
  drawParts(); if(shake>0) ctx.restore();
  drawGodRays(); drawVignette(); drawHUD(); drawContextPrompt(); if(G.praying) drawPrayerOverlay(); if(G.msgT>0) drawBigMsg(); drawRoster(); }

/* ============================================================================
   FLOW
   ============================================================================ */
var scrEl=document.getElementById('screen'), scrTitle=document.getElementById('scrTitle'), scrText=document.getElementById('scrText'), scrBtn=document.getElementById('scrBtn'), scrHint=document.getElementById('scrHint');
var mode='title';
function showTitle(){ mode='title'; PROG.souls=0; scrTitle.innerHTML='Racing for Jesus<small>The Gospel Truck · Acts I–II</small>';
  scrText.innerHTML="Two helpers, one big truck. <b>Fill the Gospel Truck together</b> — one reaches the high shelf, one carries each crate to the bed — then <b>ride out</b> and give every house a <b>hug &amp; the Word</b>. Watch the grey land <b>bloom to gold</b>.<br><br><b>Two players together</b> (two controllers), or play solo — a helper fills the other role so a little one is never stuck.";
  scrBtn.textContent='▶ Go ye'; scrHint.textContent='controller, keyboard or touch · press Ⓐ / Space to begin'; scrEl.classList.add('on'); }
function startScene(i){ if(humanCount()===0) ensureLocalPlayer(); scrEl.classList.remove('on'); buildScene(i); t2=0; caption('word',G.cfg.open.text,G.cfg.open.ref); var id=++capToken; setTimeout(function(){ if(!G.done&&capToken===id) caption('narr',G.intro); },4200); setTimeout(function(){ if(!G.done) G.started=true; },700); }
function winScene(){ if(G.done)return; G.done=true; sfx.win(); caption(); G.light=clamp(G.light+(G.finale?0.25:0.1),0,1);
  for(var q=0;q<44;q++) addPart({x:rand(0,W)+camX,y:rand(0,H),vy:rand(-120,-20),vx:rand(-60,60),grav:120,life:1.8,col:(q%2?'rgba(242,201,76,0.9)':'rgba(255,255,255,0.9)'),r:rand(2,4)});
  if(G.forgive) captionTimed('narr','And Joseph forgave his brethren, and kissed them — God turned it all to good.',null,3200);
  var wv=G.cfg.win, A=actOf(sceneIdx), lt=A.end-A.start+1, ln=sceneIdx-A.start+1; var isGameLast=(sceneIdx>=SCENES.length-1), isActLast=(sceneIdx===A.end);
  setTimeout(function(){ if(isGameLast){ mode='actdone'; scrTitle.innerHTML='All Nations Fed<small>Act II complete</small>'; scrText.innerHTML='Bread for all the world, and the brothers forgiven — <b>'+PROG.souls+'</b> souls reached, the whole land turned to colour.<br><br><b>“'+wv.text+'” ('+wv.ref+')</b><br><br><i>Act III — Jabez’s Widening Fields — is being built next.</i>'; scrBtn.textContent='▶ Play from the start'; scrHint.textContent='More of the road is coming'; }
    else if(isActLast){ mode='actcont'; var nA=actOf(sceneIdx+1); scrTitle.innerHTML='Act '+A.roman+' complete<small>'+A.name+'</small>'; scrText.innerHTML='<b>“'+wv.text+'” ('+wv.ref+')</b><br><br>'+PROG.souls+' souls reached so far. <i>Next: Act '+nA.roman+' — '+nA.name+'</i>'; scrBtn.textContent='▶ Begin Act '+nA.roman; scrHint.textContent='Scene '+(sceneIdx+2)+' of '+SCENES.length; }
    else { mode='next'; scrTitle.innerHTML=G.title+'<small>Scene '+ln+' of '+lt+' complete</small>'; scrText.innerHTML='<b>“'+wv.text+'” ('+wv.ref+')</b><br><br>'+PROG.souls+' souls reached so far. <i>Next: '+SCENES[sceneIdx+1].title+'</i>'; scrBtn.textContent='▶ Continue'; scrHint.textContent='Act '+A.roman+' · scene '+(ln+1)+' of '+lt; }
    scrEl.classList.add('on'); },2100); }
scrBtn.addEventListener('click',function(){ actx(); if(mode==='title') startScene(0); else if(mode==='next'||mode==='actcont') startScene(sceneIdx+1); else if(mode==='actdone') showTitle(); });
addEventListener('keydown',function(e){ if(scrEl.classList.contains('on') && ['Enter','NumpadEnter','Space','KeyF'].indexOf(e.code)>=0){ e.preventDefault(); scrBtn.click(); } });
function pollMenu(){ pollJoins(); var gs=readPads(); for(var i=0;i<gs.length;i++){ var gp=gs[i]; if(!gp||!claimedPad(i)) continue; if(padEdge('m'+i,gp,0)||padEdge('m'+i,gp,9)){ scrBtn.click(); break; } } }
buildScene(0); showTitle();
var last=performance.now();
function loop(now){ var dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt; t2+=dt; updateParts(dt);
  if(scrEl.classList.contains('on')){ pollMenu(); render(dt); requestAnimationFrame(loop); return; }
  if(!G.done) update(dt); render(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
